services:
    # Free-tier test deployment. Render Cron Jobs are paid, so Square webhooks
    # provide the immediate catalog sync and the fallback scheduler is omitted.
    - type: web
      name: felisa-cafe
      runtime: docker
      dockerfilePath: Dockerfile
      plan: free
      region: oregon
      healthCheckPath: /up
      envVars:
          - key: APP_NAME
            value: 'Felisa Cafe'
          - key: APP_ENV
            value: production
          - key: APP_DEBUG
            value: 'false'
          - key: APP_KEY
            sync: false
          - key: APP_URL
            sync: false
          - key: LOG_CHANNEL
            value: stderr
          - key: DB_CONNECTION
            value: pgsql
          - key: DB_HOST
            fromDatabase:
                name: felisa-cafe-db
                property: host
          - key: DB_PORT
            fromDatabase:
                name: felisa-cafe-db
                property: port
          - key: DB_DATABASE
            fromDatabase:
                name: felisa-cafe-db
                property: database
          - key: DB_USERNAME
            fromDatabase:
                name: felisa-cafe-db
                property: user
          - key: DB_PASSWORD
            fromDatabase:
                name: felisa-cafe-db
                property: password
          - key: SESSION_DRIVER
            value: database
          - key: CACHE_STORE
            value: database
          - key: QUEUE_CONNECTION
            value: database
          - key: SQUARE_ACCESS_TOKEN
            sync: false
          - key: SQUARE_APPLICATION_ID
            sync: false
          - key: SQUARE_LOCATION_ID
            sync: false
          - key: SQUARE_ENVIRONMENT
            value: sandbox
          - key: SQUARE_CURRENCY
            value: USD
          - key: SQUARE_WEBHOOK_SIGNATURE_KEY
            sync: false
          - key: SQUARE_WEBHOOK_URL
            sync: false

databases:
    - name: felisa-cafe-db
      plan: free
      region: oregon
      databaseName: felisa_cafe
      user: postgres
