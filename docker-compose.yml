services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: felisa-cafe-app
        ports:
            - '8000:8080'
        environment:
            APP_NAME: 'Felisa Cafe'
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_KEY: base64:eUf+zZ16Q9u0K64Yw4l5sV0bVwN5k3z4D1g7y3j6c8I=
            APP_URL: http://localhost:8000
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: felisa_cafe
            DB_USERNAME: postgres
            DB_PASSWORD: secretpassword
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:16-alpine
        container_name: felisa-cafe-db
        environment:
            POSTGRES_DB: felisa_cafe
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: secretpassword
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d felisa_cafe']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
